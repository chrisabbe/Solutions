<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Your Subscription — Inbox Puzzles</title>
  <style>
    /* Global Styles matched to Inbox Puzzles calm & simple theme */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafafa;
      color: #222222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .container {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      border: 1px solid #eaeaea;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-sizing: border-box;
    }

    /* Logo Image Wrapper */
    .brand-logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 12px 0;
      color: #111111;
    }

    p {
      font-size: 15px;
      color: #555555;
      margin: 0 0 32px 0;
      line-height: 1.6;
    }

    /* Primary Portal Button Layout */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 16px;
      transition: background-color 0.15s ease, transform 0.1s ease;
      border: 1px solid #111111;
    }

    .btn:hover {
      background-color: #2a2a2a;
    }

    .btn:active {
      transform: scale(0.99);
    }

    /* Secondary Portal Button Layout */
    .btn-secondary {
      background-color: #f4f4f5;
      color: #18181b;
      border: 1px solid #e4e4e7;
    }

    .btn-secondary:hover {
      background-color: #e4e4e7;
    }

    /* Visual Anchors / Icons */
    .btn-icon {
      margin-right: 10px;
      font-size: 16px;
      display: inline-block;
    }

    /* Footer Utility Link */
    .support-footer {
      font-size: 13px;
      color: #888888;
      margin-top: 32px;
    }

    .support-footer a {
      color: #555555;
      text-decoration: underline;
    }

    .support-footer a:hover {
      color: #111111;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Official Text/Brand Logo pulled from your system -->
  <img src="https://inboxpuzzles.com" alt="Inbox Puzzles" class="brand-logo" onerror="this.style.display='none';">
  
  <h1>Manage Your Subscription</h1>
  <p>To update your payment method, view invoices, or change your plan, please select how you originally joined us:</p>

  <!-- Button A: Core Website / Native Stripe -->
  <a href="https://stripe.com" class="btn">
    <span class="btn-icon">✉</span> I subscribed directly on the website
  </a>

  <!-- Button B: Whop Platform Ecosystem -->
  <a href="https://whop.com" class="btn btn-secondary">
    <span class="btn-icon">🛍️</span> I subscribed via a Whop link or affiliate
  </a>

  <!-- Support Reference -->
  <div class="support-footer">
    Need assistance? Reach us at <a href="mailto:support@inboxpuzzles.com">support@inboxpuzzles.com</a>
  </div>
</div>

</body>
</html>
