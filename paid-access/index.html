<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Start Your Puzzles</title>

<style>

  body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f4f6f7;

    color:#222;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;

    box-sizing:border-box;

  }

  .card{

    background:#fff;

    width:100%;

    max-width:420px;

    border-radius:18px;

    box-shadow:0 4px 16px rgba(0,0,0,.10);

    padding:28px 22px;

    text-align:center;

  }

  .logo{

    max-width:200px;

    width:100%;

    height:auto;

    margin:0 auto 18px;

    display:block;

  }

  h1{

    color:#008080;

    font-size:28px;

    line-height:1.2;

    margin:0 0 10px;

  }

  p{

    color:#555;

    font-size:15px;

    line-height:1.5;

    margin:0 0 18px;

  }

  input{

    width:100%;

    padding:14px;

    font-size:16px;

    border:1px solid #ccc;

    border-radius:8px;

    box-sizing:border-box;

    margin-bottom:14px;

  }

  button{

    width:100%;

    padding:14px;

    font-size:16px;

    font-weight:bold;

    color:#fff;

    background:#008080;

    border:0;

    border-radius:10px;

  }

  .note{

    margin-top:14px;

    font-size:13px;

    color:#777;

  }

</style>

</head>

<body>

<div class="card">

  <img class="logo" src="https://chrisabbe.github.io/Solutions/assets/inbox-puzzles-logo.png" alt="Inbox Puzzles">

  <h1>Start Your Puzzles</h1>

  <p>Enter your email below to receive your puzzle confirmation email.</p>

  <form method="post" action="https://sendsteed.com/subscribe/">

    <input name="e124956" required type="email" placeholder="your@email.com">

    <input type="hidden" name="lllid" value="124956">

    <input type="hidden" name="lluid" value="chrisabbe">

    <input type="hidden" name="redirect" value="">

    <input type="hidden" name="source" value="paid-access-backup">

    <button type="submit">Start My Puzzles</button>

  </form>

  <div class="note">

    After you confirm your email, your Day 001 puzzles will arrive immediately.

  </div>

</div>

</body>

</html>
